    <!-- Thema vooraf toepassen: voorkomt een witte flits bij donkere voorkeur -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#050c1b');
          }
        } catch (e) {
          /* Geen storage beschikbaar: de site start gewoon in lichte modus. */
        }
      })();
    </script>

    <!-- SPA redirect for GitHub Pages: restores the deep-link path stored by 404.html -->
    <script>
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
